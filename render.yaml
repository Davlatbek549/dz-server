# Render Blueprint. Point Render at this repository and it reads this file
# instead of needing the settings entered by hand.
#
# The database is deliberately not defined here: Render's free Postgres is
# deleted after 30 days, so the database lives on Neon instead and its details
# arrive through the environment variables below.
services:
  - type: web
    name: dz-server
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Generated once by Render and never shown in this file. Changing it
      # invalidates every access token that has already been issued.
      - key: DZ_JWT_SECRET
        generateValue: true

      # One OAuth client id per platform, comma-separated: Android tokens carry
      # the **Web** client in `aud`, iOS tokens carry the **iOS** client. A token
      # is ours if it names any of them.
      #
      # Not secrets: they ship inside every copy of the app. They sit here as
      # literals rather than being typed into the dashboard, so a blueprint sync
      # cannot drop them. Google sign-in stays off wherever this is unset.
      - key: DZ_GOOGLE_CLIENT_IDS
        value: 169301208092-ed5g27rr81ptcm2k3gfoiruhibgcl2g2.apps.googleusercontent.com,169301208092-sj71d0poosh9h0sj1mp79h496h97g49l.apps.googleusercontent.com

      # From the Neon connection details. The URL needs ?sslmode=require —
      # Neon refuses plaintext connections.
      - key: DZ_DB_URL
        sync: false
      - key: DZ_DB_USER
        sync: false
      - key: DZ_DB_PASSWORD
        sync: false
