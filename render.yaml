# Render Blueprint. Point Render at this repository and it reads this file
# instead of needing the settings entered by hand.
#
# The database is deliberately not defined here: Render's free Postgres is
# deleted after 30 days, so the database lives on Neon instead and its details
# arrive through the environment variables below.
services:
  - type: web
    name: dz-server
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Generated once by Render and never shown in this file. Changing it
      # invalidates every access token that has already been issued.
      - key: DZ_JWT_SECRET
        generateValue: true

      # The Web OAuth client id from the Google console — not the Android one,
      # because Android ID tokens carry the web client in `aud`.
      #
      # Not a secret: it ships inside every copy of the app. It sits here as a
      # literal rather than being typed into the dashboard, so a blueprint sync
      # cannot drop it. Google sign-in stays off wherever it is unset.
      - key: DZ_GOOGLE_CLIENT_ID
        value: 169301208092-ed5g27rr81ptcm2k3gfoiruhibgcl2g2.apps.googleusercontent.com

      # From the Neon connection details. The URL needs ?sslmode=require —
      # Neon refuses plaintext connections.
      - key: DZ_DB_URL
        sync: false
      - key: DZ_DB_USER
        sync: false
      - key: DZ_DB_PASSWORD
        sync: false
