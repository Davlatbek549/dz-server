services:
  postgres:
    image: postgres:17-alpine
    container_name: dz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dz
      POSTGRES_USER: dz
      POSTGRES_PASSWORD: dz_local_password
    ports:
      - "5432:5432"
    volumes:
      - dz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dz -d dz" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dz_postgres_data:
