spring:
  application:
    name: dz-server

  datasource:
    url: ${DZ_DB_URL:jdbc:postgresql://localhost:5432/dz}
    username: ${DZ_DB_USER:dz}
    password: ${DZ_DB_PASSWORD:dz_local_password}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${DZ_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: debug
