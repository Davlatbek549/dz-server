spring:
  application:
    name: dz-server

  datasource:
    url: ${DZ_DB_URL:jdbc:postgresql://localhost:5432/dz}
    username: ${DZ_DB_USER:dz}
    password: ${DZ_DB_PASSWORD:dz_local_password}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

dz:
  jwt:
    # Development-only fallback. The prod profile below removes it, so a
    # deployment cannot start without a real one: anyone holding this value can
    # mint a valid token for any account.
    secret: ${DZ_JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    issuer: dz-server
    access-token-ttl: 15m
    refresh-token-ttl: 30d

server:
  # Hosts assign the port and pass it in as PORT; DZ_SERVER_PORT stays as the
  # local override.
  port: ${PORT:${DZ_SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: debug

---
# Deployment profile. Activate with SPRING_PROFILES_ACTIVE=prod.
spring:
  config:
    activate:
      on-profile: prod

dz:
  jwt:
    # No fallback on purpose: startup fails loudly if the secret is missing,
    # rather than quietly signing tokens with a value that is public in git.
    secret: ${DZ_JWT_SECRET}

management:
  endpoint:
    health:
      # The detailed report names the database, disk paths and free space. That
      # is useful locally and reconnaissance material on a public URL.
      show-details: never

logging:
  level:
    # Statement logging would put user data in the platform's log viewer.
    org.hibernate.SQL: warn
