spring:
  application:
    name: dz-server

  datasource:
    url: ${DZ_DB_URL:jdbc:postgresql://localhost:5432/dz}
    username: ${DZ_DB_USER:dz}
    password: ${DZ_DB_PASSWORD:dz_local_password}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Profile photo and banner uploads. Bigger files are refused before they are read in.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

dz:
  storage:
    # Where uploaded profile photos and banners are kept. `local` is a folder this server serves at
    # /files; `none` refuses uploads. The prod profile below defaults to `none`.
    type: ${DZ_STORAGE_TYPE:local}
    local-directory: ${DZ_STORAGE_DIR:data/uploads}
    # The address the app fetches files from. An Android emulator reaches this machine as
    # 10.0.2.2, so set http://10.0.2.2:8080/files when testing from one.
    public-base-url: ${DZ_STORAGE_PUBLIC_URL:http://localhost:8080/files}

  oauth:
    google:
      # The **Web** OAuth client id from the Google console, not the Android one: Android tokens
      # carry the web client in `aud`. Not a secret — it ships inside the app — but it differs
      # per project, so it stays in configuration.
      client-id: ${DZ_GOOGLE_CLIENT_ID:}

  mail:
    # Must sit under the domain verified with the provider, or the message fails
    # SPF and DKIM and is filed as spam rather than delivered.
    from: ${DZ_MAIL_FROM:dz <noreply@mail.dzreader.com>}
    # A real secret, unlike the Google client ids: it grants sending rights on
    # the domain. Blank locally, which selects the logging stand-in so the code
    # appears in the server output instead of an inbox.
    api-key: ${DZ_RESEND_API_KEY:}

  verification:
    code-length: 6
    ttl: 15m
    # Six digits is a million possibilities, which is only out of reach while
    # guesses are capped.
    max-attempts: 5
    resend-cooldown: 60s

  jwt:
    # Development-only fallback. The prod profile below removes it, so a
    # deployment cannot start without a real one: anyone holding this value can
    # mint a valid token for any account.
    secret: ${DZ_JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    issuer: dz-server
    access-token-ttl: 15m
    refresh-token-ttl: 30d

server:
  # Hosts assign the port and pass it in as PORT; DZ_SERVER_PORT stays as the
  # local override.
  port: ${PORT:${DZ_SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: debug

---
# Deployment profile. Activate with SPRING_PROFILES_ACTIVE=prod.
spring:
  config:
    activate:
      on-profile: prod

dz:
  jwt:
    # No fallback on purpose: startup fails loudly if the secret is missing,
    # rather than quietly signing tokens with a value that is public in git.
    secret: ${DZ_JWT_SECRET}
  storage:
    # Render wipes its disk on every deploy, so a local folder would lose every photo at the next
    # release. Until real storage is configured, uploads are refused instead.
    type: ${DZ_STORAGE_TYPE:none}

management:
  endpoint:
    health:
      # The detailed report names the database, disk paths and free space. That
      # is useful locally and reconnaissance material on a public URL.
      show-details: never

logging:
  level:
    # Statement logging would put user data in the platform's log viewer.
    org.hibernate.SQL: warn
